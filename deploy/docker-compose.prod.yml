version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowflow}
      POSTGRES_USER: ${POSTGRES_USER:-knowflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowflow_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowflow} -d ${POSTGRES_DB:-knowflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-08Z
    container_name: knowflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knowflow_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-knowflow_minio_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  minio-init:
    image: minio/mc:RELEASE.2024-03-30T15-28-42Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-knowflow_admin} ${MINIO_ROOT_PASSWORD:-knowflow_minio_secret};
      mc mb --ignore-existing local/${KNOWFLOW_S3_BUCKET:-knowflow-docs};
      exit 0;
      "

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: knowflow-backend:1.0.0
    container_name: knowflow-backend
    restart: unless-stopped
    user: "1001:1001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-knowflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-knowflow_secure_pass}
      KNOWFLOW_JWT_SECRET: ${KNOWFLOW_JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      KNOWFLOW_STORAGE_TYPE: s3
      KNOWFLOW_STORAGE_S3_ENDPOINT: http://minio:9000
      KNOWFLOW_STORAGE_S3_BUCKET: ${KNOWFLOW_S3_BUCKET:-knowflow-docs}
      KNOWFLOW_STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-knowflow_admin}
      KNOWFLOW_STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-knowflow_minio_secret}
      KNOWFLOW_AI_ENABLED: ${KNOWFLOW_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: knowflow-frontend:1.0.0
    container_name: knowflow-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  caddy:
    image: caddy:2.7.6-alpine
    container_name: knowflow-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
