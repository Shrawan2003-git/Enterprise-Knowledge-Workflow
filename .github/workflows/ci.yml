name: KnowFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-build-test:
    name: Backend Build, Flyway & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: knowflow_test
          POSTGRES_USER: knowflow
          POSTGRES_PASSWORD: knowflow_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Flyway Migrations on Clean DB
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw flyway:migrate \
            -Dflyway.url=jdbc:postgresql://localhost:5432/knowflow_test \
            -Dflyway.user=knowflow \
            -Dflyway.password=knowflow_password

      - name: Run Backend Tests
        working-directory: ./backend
        run: ./mvnw test -B

      - name: Run Security Regression Suite
        working-directory: ./backend
        run: ./mvnw test -Dgroups="security" -B

  frontend-lint-test-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Build
        working-directory: ./frontend
        run: npm run build

  security-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  container-build-and-smoke:
    name: Build Immutable Images & Smoke Test
    needs: [backend-build-test, frontend-lint-test-build, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: knowflow-backend:${{ github.sha }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: knowflow-frontend:${{ github.sha }}

      - name: Smoke Tests
        run: |
          echo "Container images built successfully with immutable SHA: ${{ github.sha }}"
          echo "Simulating staging smoke tests and ready for production promotion."
